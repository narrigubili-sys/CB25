<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CB25 Cricket Score</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><h1>🏏 CB25</h1><p>Cricket Score Manager</p></header>
<nav class="navBar">
<button class="nav active" data-page="score">Score</button>
<button class="nav" data-page="history">History</button>
</nav>
<main class="container">
<section id="scorePage">
<div id="setupCard" class="card">
<h2>Create Match</h2>
<div class="grid">
<label>Team 1<input id="team1" placeholder="Team A"></label>
<label>Team 2<input id="team2" placeholder="Team B"></label>
<label>Max Overs<input id="maxOvers" type="number" min="1" value="10"></label>
</div>
<div class="grid two">
<label>Team 1 Players<textarea id="players1" rows="7" placeholder="Player 1&#10;Player 2&#10;Player 3"></textarea></label>
<label>Team 2 Players<textarea id="players2" rows="7" placeholder="Player 1&#10;Player 2&#10;Player 3"></textarea></label>
</div>
<button id="startBtn" class="primary">Start Match</button>
</div>
<div id="scoreCard" class="card hidden">
<div class="scoreHead"><div><h2 id="matchTitle"></h2><span id="inningsLabel" class="muted"></span></div><span id="status" class="status">LIVE</span></div>
<div class="scoreBox"><div id="score">0/0</div><small id="overs">0.0 / 10.0 overs</small></div>
<div class="section"><h3>Batters</h3><div id="battersTable"></div></div>
<div class="section"><div class="row"><h3>Bowler</h3><select id="bowlerSelect"></select></div><div id="bowlerTable"></div></div>
<div class="section"><h3>Scoring</h3><div class="actions">
<button data-action="run" data-runs="0">0</button><button data-action="run" data-runs="1">1</button>
<button data-action="run" data-runs="2">2</button><button data-action="run" data-runs="3">3</button>
<button data-action="run" data-runs="4">4</button><button data-action="run" data-runs="6">6</button>
<button data-action="wide">Wide</button><button data-action="noball">No Ball</button>
<button data-action="bye">Bye</button><button data-action="legbye">Leg Bye</button>
<button data-action="wicket" class="danger">Wicket</button>
</div></div>
<div class="section"><h3>Recent Balls</h3><div id="balls" class="balls"></div></div>
<div class="footerActions"><button id="changeBatterBtn">Change Batter</button><button id="undoBtn">Undo</button><button id="saveBtn">Save</button><button id="newBtn" class="danger">New Match</button></div>
</div>
</section>
<section id="historyPage" class="hidden"><div class="card"><div class="row"><h2>Saved Matches</h2><button id="refreshHistory">Refresh</button></div><div id="history"></div></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalBox"><div class="row"><h3>Select New Batter</h3><button id="closeModal">✕</button></div><div id="batterOptions"></div></div></div>
<script src="app.js"></script>
</body>
</html>
